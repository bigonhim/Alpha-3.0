[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "alphago"
version = "0.1.0"
description = "WorldQuant BRAIN alpha research workstation (desktop app, Gemini-assisted)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nicegui>=3.18",
    "pywebview>=6.2",
    "httpx>=0.28",
    "lark>=1.3",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "keyring>=25",
    "google-genai>=2.30",
    "jinja2>=3.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "tzdata>=2024.1",
    "yfinance>=0.2.54",               # SPC Lab PnL test (Yahoo Finance daily prices)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "pyinstaller>=6.20", "ruff>=0.6"]

[project.scripts]
alphago = "alphago.__main__:main"

[tool.setuptools.packages.find]
include = ["alphago*"]

[tool.setuptools.package-data]
alphago = ["fastexpr/*.lark", "llm/prompts/*.j2", "ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
